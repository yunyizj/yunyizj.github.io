<!DOCTYPE html>
<html lang="{% if page.lang == 'en' %}en{% else %}zh-Hant{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="site-brand" href="{% if page.lang == 'en' %}{{ '/en/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">
    <span class="site-brand-zh">張簡雲翊@Taiwan</span>
  </a>
  <button class="mobile-toggle" aria-expanded="false" aria-label="Toggle navigation">Menu</button>
  <nav class="top-nav" aria-label="Primary navigation">
  {% if page.lang == 'en' %}
    <a class="{% if page.nav == 'home' %}active{% endif %}" href="{{ '/en/' | relative_url }}">Home</a>
    <a class="{% if page.nav == 'about' %}active{% endif %}" href="{{ '/en/about.html' | relative_url }}">About</a>
    <a class="{% if page.nav == 'tools' %}active{% endif %}" href="{{ '/en/tools.html' | relative_url }}">Learning Tools</a>
    <a class="{% if page.nav == 'publications' %}active{% endif %}" href="{{ '/en/publications.html' | relative_url }}">Publications</a>
    <a class="language-switch" href="{{ page.zh_url | default: '/' | relative_url }}">中文</a>
  {% else %}
    <a class="{% if page.nav == 'home' %}active{% endif %}" href="{{ '/' | relative_url }}">首頁</a>
    <a class="{% if page.nav == 'about' %}active{% endif %}" href="{{ '/about.html' | relative_url }}">關於我</a>
    <a class="{% if page.nav == 'tools' %}active{% endif %}" href="{{ '/tools.html' | relative_url }}">學習工具</a>
    <a class="{% if page.nav == 'publications' %}active{% endif %}" href="{{ '/publications.html' | relative_url }}">發表</a>
    <a class="language-switch" href="{{ page.en_url | default: '/en/' | relative_url }}">EN</a>
  {% endif %}
  </nav>
</header>
{{ content }}
<footer class="site-footer"><div class="footer-inner"><span>© {{ 'now' | date: '%Y' }} ZHANG JIAN, Yun-Yi</span></div></footer>
<script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>

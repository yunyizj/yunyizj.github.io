<!DOCTYPE html>
<html lang="{% if page.lang == 'en' %}en{% else %}zh-Hant{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-header">
  <a class="site-brand" href="{% if page.lang == 'en' %}/en/{% else %}/{% endif %}">
    <span class="site-brand-zh">張簡雲翊@Taiwan</span>
    <span class="site-brand-en">ZHANG JIAN, Yun-Yi</span>
  </a>

  <button class="mobile-toggle" aria-expanded="false" aria-label="Toggle navigation">Menu</button>

  <nav class="top-nav" aria-label="Primary navigation">
  {% if page.lang == 'en' %}
    <div class="nav-item"><a class="nav-link {% if page.nav == 'home' %}active{% endif %}" href="/en/">Home</a></div>
    <div class="nav-item"><a class="nav-link {% if page.nav == 'about' %}active{% endif %}" href="/en/about.html">About</a></div>

    <div class="nav-item">
      <a class="nav-link {% if page.nav == 'experience' %}active{% endif %}" href="/en/experience.html">Experience <span class="nav-arrow" aria-hidden="true"></span></a>
      <div class="dropdown">
        <span class="dropdown-label">Experience</span>
        <a href="/en/academic-experience.html">Academic Experience</a>
        <a href="/en/education-experience.html">Education Experience</a>
      </div>
    </div>

    <div class="nav-item"><a class="nav-link {% if page.nav == 'publications' %}active{% endif %}" href="/en/publications.html">Publications</a></div>
    <div class="nav-item"><a class="nav-link {% if page.nav == 'tools' %}active{% endif %}" href="/en/tools.html">Learning Tools</a></div>
    <div class="nav-item"><a class="nav-link language-switch" href="{% if page.zh_url %}{{ page.zh_url }}{% else %}/{% endif %}">中文</a></div>
  {% else %}
    <div class="nav-item"><a class="nav-link {% if page.nav == 'home' %}active{% endif %}" href="/">首頁</a></div>
    <div class="nav-item"><a class="nav-link {% if page.nav == 'about' %}active{% endif %}" href="/about.html">關於我</a></div>

    <div class="nav-item">
      <a class="nav-link {% if page.nav == 'experience' %}active{% endif %}" href="/experience.html">經歷 <span class="nav-arrow" aria-hidden="true"></span></a>
      <div class="dropdown">
        <span class="dropdown-label">Experience</span>
        <a href="/academic-experience.html">學術經歷</a>
        <a href="/education-experience.html">教育經歷</a>
      </div>
    </div>

    <div class="nav-item"><a class="nav-link {% if page.nav == 'publications' %}active{% endif %}" href="/publications.html">發表</a></div>
    <div class="nav-item"><a class="nav-link {% if page.nav == 'tools' %}active{% endif %}" href="/tools.html">學習工具</a></div>
    <div class="nav-item"><a class="nav-link language-switch" href="{% if page.en_url %}{{ page.en_url }}{% else %}/en/{% endif %}">EN</a></div>
  {% endif %}
  </nav>
</header>

{{ content }}

<footer class="site-footer">
  <div class="footer-inner"><span>© {{ 'now' | date: '%Y' }} ZHANG JIAN, Yun-Yi</span></div>
</footer>

<script src="/assets/site.js"></script>
</body>
</html>

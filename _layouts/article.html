---
layout: default
---
<main class="page">
  <section class="detail-head">
    <a class="back" href="{% if page.lang == 'en' %}{{ '/en/articles.html' | relative_url }}{% else %}{{ '/articles.html' | relative_url }}{% endif %}">← {% if page.lang == 'en' %}All articles{% else %}所有文章{% endif %}</a>
    <span class="kicker">{{ page.date | date: '%Y.%m.%d' }} · {{ page.category }}</span>
    <h1 class="detail-title">{{ page.title }}</h1>
  </section>
  <section class="detail-body" style="grid-template-columns:1fr;max-width:900px">
    <article class="detail-copy">{{ content }}</article>
  </section>
</main>

<body>
<main class="wrap">
<header><div class="logo">W</div><div><h1>英文單字練習</h1><div class="muted">選擇單元，開始今天的挑戰</div></div><div class="header-actions"><button class="study-header-btn" id="openStudy" type="button">背單字</button></div></header>
<section id="setup" class="panel">
 <div class="section"><div class="row-between"><h2>① 選擇練習單元</h2><div><button type="button" class="linkbtn" id="allUnits">全選</button><button type="button" class="linkbtn" id="clearUnits">清除</button></div></div><div id="unitGrid" class="unit-grid"></div><p class="hint" id="vocabCount"></p></div>
 <div class="section"><h2>② 練習題數</h2><label for="numQuestions" class="muted">請輸入題數</label><input id="numQuestions" type="number" min="1" max="500" step="1" value="10" class="number-box" inputmode="numeric"></div>
 <div class="section"><h2>③ 選擇題型</h2><div class="types"><label class="type-row"><input type="checkbox" id="chooseType" checked><span>選擇題<br><small>中文選英文、英文選中文（四選一）</small></span></label><label class="type-row"><input type="checkbox" id="spellType" checked><span>拼音題<br><small>看中文輸入完整英文，完全相符才得分</small></span></label></div></div>
 <button id="startBtn" class="primary full">開始練習</button><p id="setupError" class="error-text" aria-live="polite"></p>
</section>

<section id="studySetup" class="panel hidden">
 <div class="study-nav"><div class="study-title">選擇背誦單元</div></div>
 <p class="muted">可選擇一個或多個單元，單字依照課本原有順序排列。</p>
 <div class="row-between" style="margin-top:18px"><h2 style="margin:0">單元</h2><div><button class="linkbtn" id="studyAllUnits" type="button">全選</button><button class="linkbtn" id="studyClearUnits" type="button">清除</button></div></div>
 <div class="study-unit-grid" id="studyUnitGrid"></div><p id="studyCount" class="hint"></p>
 <button class="primary full" id="beginStudy" type="button">開始背單字</button><p id="studyError" class="study-empty" role="alert"></p>
</section>
<section id="studyCards" class="hidden">
 <div class="study-nav"><button type="button" id="studyCardsBack">← 選擇單元</button><span class="study-title">背單字</span></div>
 <div class="panel"><div class="study-card-head"><span class="study-counter" id="studyCardCounter"></span><div class="study-actions"><button id="cardToggleZh" type="button" class="study-visibility-btn" aria-pressed="false">隱藏中文</button><button id="cardToggleEn" type="button" class="study-visibility-btn" aria-pressed="false">隱藏英文</button><button id="openStudyList" type="button" class="study-list-toggle">單字清單</button></div></div>
 <div class="flashcard" aria-live="polite"><div class="flash-en" id="studyEn"></div><div class="flash-pos" id="studyPos"></div><div class="flash-ipa" id="studyIpa"></div><div class="flash-zh" id="studyZh"></div></div>
 <div class="flash-nav"><button class="flash-prev" id="studyPrev" type="button">← 上一個</button><button class="flash-next" id="studyNext" type="button">下一個 →</button></div></div>
</section>
<section id="studyList" class="panel hidden"><div class="study-nav study-list-header"><div class="study-title">單字清單</div><div class="study-actions"><button id="listToggleZh" type="button" class="study-visibility-btn" aria-pressed="false">隱藏中文</button><button id="listToggleEn" type="button" class="study-visibility-btn" aria-pressed="false">隱藏英文</button><button id="studyListBack" type="button">返回單字卡</button></div></div><div class="study-list-intro">依課本單元與順序排列，點選任一單字即可跳到該張單字卡。</div><div id="studyListContent"></div></section>
<section id="quiz" class="hidden"><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button id="terminateEnglish" type="button" style="padding:9px 14px;border:1px solid #db8d83;background:#fff5f3;color:#a33529;border-radius:12px;cursor:pointer">終止測驗</button></div>
 <div class="topline"><div class="stat"><div class="stat-label">練習時間</div><div id="timer" class="stat-value">00:00</div></div><div class="stat"><div class="stat-label">目前題數</div><div class="stat-value"><span id="currentNum">1</span> / <span id="totalNum">10</span></div></div></div>
 <div class="bar-track"><div class="bar-fill" id="progress"></div></div>
 <div class="panel"><div class="question-label" id="questionLabel">選擇題</div><div id="question" class="question"></div><div id="questionPrompt" class="prompt"></div><div id="choiceGrid" class="choices"></div><div id="spellBox" class="answer-box hidden"><form id="spellForm" autocomplete="off"><input id="spellInput" class="answer-input" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="輸入英文答案"><button class="primary full" style="margin-top:13px" id="submitSpell" type="submit">送出答案</button></form></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div class="question-actions"><button id="nextBtn" class="primary hidden" type="button">下一題 →</button></div></div>
</section>
<section id="results" class="panel hidden"><div class="result-header"><div class="question-label">練習完成</div><h2 style="margin-top:10px">本次練習結果</h2><div id="totalScore" class="score-big">0 / 10</div><div id="scoreRate" class="muted"></div><div id="finishedAtEnglish" class="muted" style="margin-top:9px"></div></div><div class="result-grid" id="resultStats"></div><h2>需要再練習的單字 <span id="wrongCount" class="tag">0</span></h2><div id="wrongList" class="wrong-list"></div><div class="result-buttons"><button class="secondary" id="retryBtn">相同設定再練習</button><button class="primary" id="backBtn">重新選擇單元</button></div></section>

</main>

function elapsed(){return Math.floor((Date.now()-started)/1000)}
function timeString(t){let h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?`${String(h).padStart(2,'0')}:`:'')+`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function getPool(){return selected.flatMap(u=>UNIT_DATA[u].map((w,i)=>({...w,id:`${u}-${i}`})))}
function buildQueue(pool,n,types){let cards=[],wordBag=[];for(let i=0;i<n;i++){if(!wordBag.length)wordBag=shuffle(pool);let word=wordBag.pop();let type=types[i%types.length];cards.push({word,type})}return shuffle(cards)}
function start(custom){const units=custom?.units??getUnits();let n=custom?.n??Number($('numQuestions').value);let choose=custom?.choose??$('chooseType').checked,spell=custom?.spell??$('spellType').checked;
 const err=$('setupError');err.textContent='';if(!units.length){err.textContent='請至少選擇一個單元。';return}if(!Number.isInteger(n)||n<1||n>500){err.textContent='題數請輸入 1 至 500 的整數。';return}if(!choose&&!spell){err.textContent='請至少勾選一種題型。';return}
 selected=units;const pool=getPool();const distinctEn=new Set(pool.map(w=>w.en)).size,distinctZh=new Set(pool.map(w=>w.zh)).size;
 if(choose&&(distinctEn<4||distinctZh<4)){err.textContent='選擇題至少需要四個不同英文和中文選項。';return}

 }
 for(const id of ['cardToggleZh','listToggleZh']){
  $(id).textContent=studyHideZh?'顯示中文':'隱藏中文';
  $(id).setAttribute('aria-pressed',String(studyHideZh));
 }
 for(const id of ['cardToggleEn','listToggleEn']){
  $(id).textContent=studyHideEn?'顯示英文':'隱藏英文';
  $(id).setAttribute('aria-pressed',String(studyHideEn));
 }
}
for(const id of ['cardToggleZh','listToggleZh']) $(id).onclick=()=>{studyHideZh=!studyHideZh;updateStudyVisibility()};
for(const id of ['cardToggleEn','listToggleEn']) $(id).onclick=()=>{studyHideEn=!studyHideEn;updateStudyVisibility()};
updateStudyVisibility();
let studyWords=[],studyIndex=0,studyUnits=[];
const studyViews=['setup','quiz','results','studySetup','studyCards','studyList'];
function showStudyView(name){studyViews.forEach(id=>$(id).classList.toggle('hidden',id!==name));$('openStudy').textContent=['studySetup','studyCards','studyList'].includes(name)?'返回練習':'背單字';window.scrollTo(0,0)}
function getStudyUnits(){return [...document.querySelectorAll('#studyUnitGrid input:checked')].map(el=>Number(el.value)).sort((a,b)=>a-b)}
Object.keys(UNIT_DATA).sort((a,b)=>Number(a)-Number(b)).forEach(u=>{
 const label=document.createElement('label');label.className='unit-option';
 const input=document.createElement('input');input.type='checkbox';input.value=u;
 const span=document.createElement('span');span.className='unit-body';span.textContent=`Unit ${u}`;
 const small=document.createElement('small');small.textContent=`${UNIT_DATA[u].length} 個單字`;span.appendChild(small);
 label.append(input,span);$('studyUnitGrid').appendChild(label);
});
function updateStudyCount(){const units=getStudyUnits();const count=units.reduce((n,u)=>n+UNIT_DATA[u].length,0);$('studyCount').textContent=`已選 ${units.length} 個單元，共 ${count} 個單字`}
$('studyUnitGrid').addEventListener('change',updateStudyCount);
$('studyAllUnits').onclick=()=>{document.querySelectorAll('#studyUnitGrid input').forEach(el=>el.checked=true);updateStudyCount()};
$('studyClearUnits').onclick=()=>{document.querySelectorAll('#studyUnitGrid input').forEach(el=>el.checked=false);updateStudyCount()};
$('openStudy').onclick=()=>{const inStudy=['studySetup','studyCards','studyList'].some(id=>!$(id).classList.contains('hidden'));if(inStudy){showStudyView('setup');return}clearTimeout(advanceTimeout);if(interval)clearInterval(interval);$('studyError').textContent='';showStudyView('studySetup')};

$('beginStudy').onclick=()=>{
 studyUnits=getStudyUnits();if(!studyUnits.length){$('studyError').textContent='請至少選擇一個單元。';return}
 $('studyError').textContent='';studyWords=studyUnits.flatMap(u=>UNIT_DATA[u].map((word,i)=>({...word,studyUnit:u,studyOrder:i})));
 studyIndex=0;renderStudyCard();showStudyView('studyCards');
};
function renderStudyCard(){const w=studyWords[studyIndex];if(!w)return;
 $('studyCardCounter').textContent=`Unit ${w.studyUnit} · ${studyIndex+1} / ${studyWords.length}`;
 $('studyEn').textContent=w.en;$('studyPos').textContent=w.pos||'';$('studyIpa').textContent=w.ipa?`/${w.ipa}/`:'—';$('studyZh').textContent=w.zh;
 $('studyPrev').disabled=false;$('studyNext').disabled=false;
}
$('studyPrev').onclick=()=>{if(!studyWords.length)return;studyIndex=(studyIndex-1+studyWords.length)%studyWords.length;renderStudyCard()};
$('studyNext').onclick=()=>{if(!studyWords.length)return;studyIndex=(studyIndex+1)%studyWords.length;renderStudyCard()};
$('studyCardsBack').onclick=()=>showStudyView('studySetup');
function renderStudyList(){const container=$('studyListContent');container.replaceChildren();
 for(const u of studyUnits){const group=document.createElement('div');group.className='study-list-group';const h=document.createElement('h3');h.textContent=`Unit ${u}`;group.appendChild(h);
 studyWords.forEach((w,i)=>{if(w.studyUnit!==u)return;
 const button=document.createElement('button');button.type='button';button.className='study-word-row';
 const left=document.createElement('div');const en=document.createElement('div');en.className='study-word-en';en.textContent=w.en;
 const pos=document.createElement('span');pos.className='study-word-pos';pos.textContent=w.pos?`  ${w.pos}`:'';en.appendChild(pos);
 const ipa=document.createElement('div');ipa.className='study-word-ipa';ipa.textContent=w.ipa?`/${w.ipa}/`:'—';left.append(en,ipa);
 const zh=document.createElement('div');zh.className='study-word-zh';zh.textContent=w.zh;button.append(left,zh);
 button.onclick=()=>{studyIndex=i;renderStudyCard();showStudyView('studyCards')};group.appendChild(button);
 });container.appendChild(group)}
}
$('openStudyList').onclick=()=>{renderStudyList();showStudyView('studyList')};
$('studyListBack').onclick=()=>showStudyView('studyCards');
updateStudyCount();
</script>
<script type="module" src="./school-hub.js"></script>
</body>

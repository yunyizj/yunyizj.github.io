<body>
<main class="wrap">
<header class="head"><div class="logo" aria-hidden="true">ㄅ</div><h1>注音與漢字</h1></header>
<nav class="mode-tabs" aria-label="學習模式"><button id="tabCompose" class="mode-tab active" type="button" aria-pressed="true">拼拼看</button><button id="tabRead" class="mode-tab" type="button" aria-pressed="false">唸一唸</button></nav>
<div id="composeMode">
<section class="panel stage" aria-label="拼音區">
<div class="stage-head"><button class="clear" id="reset" type="button">清空</button></div>
<div class="compose" id="compose">
 <div class="vertical" id="vertical">
   <button id="initialSlot" class="slot" data-target="initial" type="button" aria-label="第一格，可放ㄅ到ㄙ或ㄧㄨㄩ，點擊可播放"><span class="symbol plus">＋</span><span class="remove" aria-hidden="true">×</span></button>
   <button id="rhymeSlot" class="slot rhyme" data-target="rhyme" type="button" aria-label="第二格，點擊播放已放入的卡牌"><span class="symbol plus">＋</span><span class="remove" aria-hidden="true">×</span></button>
   <div id="toneMark" class="tone-mark" aria-hidden="true"></div>
 </div>
 <div class="action-stack">
   <button class="play-btn" id="playFull" type="button" aria-label="聽拼好的讀音" title="聽讀音" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5a10 10 0 0 1 0 14"/></svg></button>
   <button class="examples-btn" id="openExamples" type="button" disabled>舉例</button>
 </div>
</div>
<div class="tones" id="toneButtons" aria-label="選擇聲調"></div>
</section>
<section class="panel bank" aria-label="注音卡牌">
 <div class="strip-wrap"><span class="strip-index" aria-hidden="true">1</span><button class="rail-arrow" type="button" data-rail="initialRail" data-dir="-1" aria-label="上一組">‹</button><div class="rail" id="initialRail" aria-label="第一排卡牌，包含ㄧ、ㄨ、ㄩ"></div><button class="rail-arrow" type="button" data-rail="initialRail" data-dir="1" aria-label="下一組">›</button></div>
 <div class="strip-wrap"><span class="strip-index" aria-hidden="true">2</span><button class="rail-arrow" type="button" data-rail="rhymeRail" data-dir="-1" aria-label="上一組">‹</button><div class="rail" id="rhymeRail" aria-label="第二排卡牌"></div><button class="rail-arrow" type="button" data-rail="rhymeRail" data-dir="1" aria-label="下一組">›</button></div>
</section>
</div>
<section class="panel reading" id="readMode" hidden aria-label="唸一唸"><div class="reading-grid" id="readingGrid"></div></section>
<div class="status" id="message" role="status" aria-live="polite"></div>
<footer class="sources"><a href="https://language.moe.gov.tw/001/Upload/files/SITE_CONTENT/M0001/deploy/index.html" target="_blank" rel="noopener">讀音參考：教育部注音手冊</a> · <a href="https://github.com/hanziguru/pinyin-audio" target="_blank" rel="noopener">音節錄音來源</a></footer>
</main>
<div class="overlay hidden" id="overlay" role="presentation">
 <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogName">
  <div class="dialog-top"><strong id="dialogName">舉例</strong><button id="closeDialog" class="close" type="button" aria-label="關閉視窗">×</button></div>
  <div id="wordTiles" class="word-tiles"></div><div id="definition" class="definition" hidden></div>
 </section>
</div>

'ㄩ':'yu','ㄩㄝ':'yue','ㄩㄢ':'yuan','ㄩㄣ':'yun','ㄩㄥ':'yong'};
const WITH_INITIAL={
'ㄧ':'i','ㄧㄚ':'ia','ㄧㄛ':'io','ㄧㄝ':'ie','ㄧㄞ':'iai','ㄧㄠ':'iao','ㄧㄡ':'iu','ㄧㄢ':'ian','ㄧㄣ':'in','ㄧㄤ':'iang','ㄧㄥ':'ing',
'ㄨ':'u','ㄨㄚ':'ua','ㄨㄛ':'uo','ㄨㄞ':'uai','ㄨㄟ':'ui','ㄨㄢ':'uan','ㄨㄣ':'un','ㄨㄤ':'uang','ㄨㄥ':'ong',
'ㄩ':'ü','ㄩㄝ':'üe','ㄩㄢ':'üan','ㄩㄣ':'ün','ㄩㄥ':'iong'};
const SIMPLE={'ㄚ':'a','ㄛ':'o','ㄜ':'e','ㄝ':'ê','ㄞ':'ai','ㄟ':'ei','ㄠ':'ao','ㄡ':'ou','ㄢ':'an','ㄣ':'en','ㄤ':'ang','ㄥ':'eng','ㄦ':'er'};
const PREFERRED_TONE={'ㄆㄧㄠ':3,'ㄅㄨ':3,'ㄇㄚ':0,'ㄨㄛ':2,'ㄋㄧ':2,'ㄏㄠ':2,'ㄒㄩㄝ':1,'ㄖ':3};
// Two-slot spelling: ㄧ+ㄚ is the same syllable as the compound rhyme ㄧㄚ,
// and ㄆ+ㄧㄠ is a normal consonant plus compound rhyme.
// Top slot accepts the 21 consonants OR the three medials when no consonant is used.
function syllable(){return state.initial+state.rhyme;}
function valid(base){return LEGAL.has(base);}
const ENABLED_BASES=new Set([...LEGAL].filter(base=>TONES.some((_,tone)=>(EXAMPLES[`${base}|${tone}`]||[]).some(x=>x.char&&x.word&&x.word.includes(x.char)))));
function playableSyllable(base){return ENABLED_BASES.has(base);}
// The tapped card can be selected if it either completes a word or can be completed
// with a SECOND card. Precomputing that avoids second-order errors when switching order.
const FIRST_CHOICES=new Set([...ENABLED_BASES].flatMap(base=>FIRST_CARDS.filter(ch=>base===ch||base.startsWith(ch))));
const SECOND_CHOICES=new Set([...ENABLED_BASES].flatMap(base=>RYME_CARDS.filter(ch=>base===ch||base.endsWith(ch))));
function hasSample(initial,rhyme){return playableSyllable(initial+rhyme);}
// A first-slot medial must pair only with a bare final, not with a compound rhyme.
function allowedPair(initial,rhyme){
 if(!initial||!rhyme)return true;
 if(MEDIALS.includes(initial))return FINALS.includes(rhyme);
 return INITIALS.includes(initial)&&RYME_CARDS.includes(rhyme);
}
// Normalizes an independent two-character rhyme into a top medial and a bottom final;
// ensures that ㄧㄚ is always shown as [ㄧ] / [ㄚ] on this screen.
function normalizedSelection(group,sym){
 let first=state.initial, second=state.rhyme;
 if(group==='initial'){
   // A vowel-onset compound may already be shown as [ㄧ]/[ㄠ].
   // If the pupil then chooses ㄆ, prefer [ㄆ]/[ㄧㄠ], not [ㄆ]/[ㄠ].
   if(INITIALS.includes(sym)&&MEDIALS.includes(first)){
     if(second){
       const whole=first+second;
       if(COMBOS.includes(whole)&&playableSyllable(sym+whole))second=whole;
     }else if(playableSyllable(sym+first))second=first;
   }
   first=sym;
 } else if(!first&&MEDIALS.includes(sym)) {
   first=sym;second='';
 } else if(!first&&sym.length>1&&MEDIALS.includes(sym[0])){
   // After choosing ㄧㄚ alone, display the real two-symbol spelling ㄧ above ㄚ.
   first=sym[0];second=sym.slice(1);
 }else second=sym;
 return {initial:first,rhyme:second};
}
function canPick(group,sym){
 const proposed=normalizedSelection(group,sym),a=proposed.initial,r=proposed.rhyme;
 if(a&&r)return allowedPair(a,r)&&hasSample(a,r);
 if(a) return [...ENABLED_BASES].some(base=>base===a || base.startsWith(a) && RYME_CARDS.some(x=>base===a+x&&allowedPair(a,x)));
 if(r) return hasSample('',r)||FIRST_CARDS.some(x=>hasSample(x,r)&&allowedPair(x,r));
 return false;
}
function availableTones(base){if(!valid(base))return TONES.map(()=>false);return TONES.map((_,idx)=>(EXAMPLES[`${base}|${idx}`]||[]).some(item=>item.char&&item.word));}
function normalizeTone(){const base=syllable(),options=availableTones(base);if(!options[state.tone]){const preferred=PREFERRED_TONE[base];state.tone=preferred!=null&&options[preferred]?preferred:(options.indexOf(true)>=0?options.indexOf(true):0);}}
function pinyin(initial,rhyme){
 if(MEDIALS.includes(initial))return ZERO_RHYME[initial+rhyme]||'';
 if(!initial)return ZERO_RHYME[rhyme]||SIMPLE[rhyme]||'';
 const prefix=PINYIN_INITIALS[initial];if(!prefix)return '';
 if(!rhyme)return ['ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ'].includes(initial)?prefix+'i':'';
 if(SIMPLE[rhyme])return prefix+SIMPLE[rhyme];
 let r=WITH_INITIAL[rhyme];if(!r)return '';
 if(r.startsWith('ü')&&['ㄐ','ㄑ','ㄒ'].includes(initial))r='u'+r.slice(1);
 if(r==='iong'&&['ㄐ','ㄑ','ㄒ'].includes(initial))return prefix+r;
 if(r==='ü'&&['ㄋ','ㄌ'].includes(initial))return prefix+'ü';
 // ㄅㄛ/ㄆㄛ/ㄇㄛ ㄈㄛ are written bo,po,mo,fo; ㄨㄥ is -ong after consonants.
 return prefix+r;
}
// 降低延遲：相同網址共用解碼快取、跳過音檔兩端靜音、略微加快但不改變聲調。
let audioContext=null,activeSource=null,playSeq=0,activeMedia=null;
const audioCache=new Map(),mediaCache=new Map();
const AUDIO_RATE=1.16;
function flashMessage(msg){clearTimeout(messageTimer);$('message').textContent=msg;messageTimer=setTimeout(()=>$('message').textContent='',2400);}
function pauseAudio(){playSeq++;try{activeSource?.stop()}catch(_){}activeSource=null;if(activeMedia){activeMedia.pause();activeMedia=null;}if(currentAudio){currentAudio.pause();currentAudio=null;}if(window.speechSynthesis)window.speechSynthesis.cancel();}
function context(){if(!audioContext){const A=window.AudioContext||window.webkitAudioContext;if(A)audioContext=new A();}if(audioContext?.state==='suspended')audioContext.resume().catch(()=>{});return audioContext;}
function getBuffer(url){if(audioCache.has(url))return audioCache.get(url);const ctx=context();if(!ctx)return Promise.reject(Error('no AudioContext'));
 const p=fetch(url,{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('audio '+r.status);return r.arrayBuffer()}).then(ab=>ctx.decodeAudioData(ab));
 audioCache.set(url,p);return p;}
function trimTimes(buf){const x=buf.getChannelData(0),rate=buf.sampleRate;let peak=0;for(let i=0;i<x.length;i+=32)peak=Math.max(peak,Math.abs(x[i]));let threshold=Math.max(.0015,peak*.022),start=0,end=x.length-1,step=Math.max(1,Math.floor(rate*.005));
 let quiet=0;for(let i=0;i<x.length;i+=step){let m=0;for(let j=i;j<Math.min(i+step,x.length);j+=4)m=Math.max(m,Math.abs(x[j]));if(m>=threshold){start=Math.max(0,i-Math.floor(rate*.025));break;}quiet=i;}
 for(let i=x.length-1;i>=0;i-=step){let m=0;for(let j=i;j>=Math.max(0,i-step);j-=4)m=Math.max(m,Math.abs(x[j]));if(m>=threshold){end=Math.min(x.length-1,i+Math.floor(rate*.040));break;}}
 if((end-start)/rate<.15)return [0,buf.duration];return [start/rate,(end+1)/rate];}
function playbackBuffer(buf,seq){if(seq!==playSeq)return;const ctx=context();const source=ctx.createBufferSource();const gain=ctx.createGain();source.buffer=buf;source.playbackRate.value=1;gain.gain.value=.96;source.connect(gain);gain.connect(ctx.destination);const [a,b]=trimTimes(buf);activeSource=source;source.onended=()=>{if(activeSource===source)activeSource=null;};source.start(0,a,Math.max(.10,b-a));}
function mediaPlay(url,seq,onFail){if(seq!==playSeq)return;let audio=mediaCache.get(url);if(!audio){audio=new Audio();audio.preload='auto';audio.src=url;mediaCache.set(url,audio);}activeMedia=audio;audio.playbackRate=AUDIO_RATE;if('preservesPitch' in audio)audio.preservesPitch=true;try{audio.currentTime=0;}catch(_){}let done=false;let timeoutId=null;const fail=()=>{if(done||seq!==playSeq)return;done=true;clearTimeout(timeoutId);audio.pause();audio.onerror=null;onFail();};audio.onerror=fail;const success=()=>{done=true;clearTimeout(timeoutId);};timeoutId=setTimeout(fail,2200);try{const result=audio.play();if(result?.then)result.then(success,fail);}catch(e){fail();}}
// 瀏覽器的合成語音僅在來源音檔無法播放時使用；以人工校對過的例字作為發音依據。
const FALLBACK_CHARS={'ㄧㄚ':'鴨','ㄧㄞ':'崖','ㄧㄛ':'唷','ㄧㄝ':'耶','ㄧㄠ':'腰','ㄧㄡ':'優','ㄧㄢ':'煙','ㄧㄣ':'音','ㄧㄤ':'央','ㄧㄥ':'英','ㄨㄚ':'蛙','ㄨㄛ':'窩','ㄨㄞ':'歪','ㄨㄟ':'威','ㄨㄢ':'彎','ㄨㄣ':'溫','ㄨㄤ':'汪','ㄨㄥ':'翁','ㄩㄝ':'約','ㄩㄢ':'冤','ㄩㄣ':'暈','ㄩㄥ':'雍'};
function aiVoiceExample(base,tone){return EXAMPLES[`${base}|${tone}`]?.[0]?.char||((!base||base.length<=1)?'':FALLBACK_CHARS[base])||'';}
function synthesizedFallback(base,tone,seq){if(seq!==playSeq)return;const text=aiVoiceExample(base,tone);if(!text||!window.speechSynthesis){flashMessage('這個讀音暫時無法播放');return;}
 const utter=new SpeechSynthesisUtterance(text);utter.lang='zh-TW';utter.rate=1.05;utter.pitch=1;
 const voices=window.speechSynthesis.getVoices();utter.voice=voices.find(v=>v.lang.toLowerCase()==='zh-tw')||voices.find(v=>v.lang.toLowerCase().startsWith('zh'))||null;
 utter.onerror=()=>{if(seq===playSeq)flashMessage('目前沒有可用的發音');};window.speechSynthesis.speak(utter);
}
function playUrls(urls,base='',tone=0){pauseAudio();const seq=playSeq;const candidates=[...new Set(urls)];let i=0;
 function next(){if(seq!==playSeq)return;if(i>=candidates.length){synthesizedFallback(base,tone,seq);return;}const url=candidates[i++];
 getBuffer(url).then(buf=>playbackBuffer(buf,seq)).catch(()=>mediaPlay(url,seq,next));}
 next();}
function syllableUrls(pin,tone){if(!pin)return [];const keys=[pin.replaceAll('ü','v'),pin.replaceAll('ü','u')];return [...new Set(keys)].map(s=>`${SYLLABLE_AUDIO_ROOT}${encodeURIComponent(s)}${tone+1}.mp3`);}
function playCard(group,symbol){if(group==='initial'||symbol.length===1){const f=moeFile[symbol];if(f)playUrls([MOE_ROOT+f],symbol,0);return;}
 const tone=availableTones(symbol).indexOf(true);const chosen=tone>=0?tone:(symbol==='ㄧㄞ'?1:0);playUrls(syllableUrls(pinyin('',symbol),chosen),symbol,chosen);}
function playComposed(){const base=syllable();if(!valid(base)||!availableTones(base)[state.tone])return;playUrls(syllableUrls(pinyin(state.initial,state.rhyme),state.tone),base,state.tone);}
// 首次開啟時預先快取開頭可見的卡牌；網路慢時不阻塞畫面。
function warmAudio(){const urls=[...INITIALS.slice(0,8),...MEDIALS,...FINALS.slice(0,5)].map(x=>MOE_ROOT+moeFile[x]);urls.forEach((url,i)=>setTimeout(()=>{if(!audioCache.has(url))getBuffer(url).catch(()=>{});},350+i*90));}
function iconNode(str,stack){const el=document.createElement('span');el.className='symbol'+(!str?' plus':'')+(stack?' stacked':'');if(!str){el.textContent='＋';return el;}
 if(stack){for(const ch of str){const item=document.createElement('span');item.textContent=ch;el.append(item);}}else el.textContent=str;return el;}
function fillSlot(key,value){const el=$(key==='initial'?'initialSlot':'rhymeSlot');const oldSymbol=el.querySelector('.symbol');oldSymbol.replaceWith(iconNode(value,key==='rhyme'&&value.length>1));el.classList.toggle('filled',!!value);el.classList.toggle('no-initial',key==='initial'&&!value&&!!state.rhyme);el.setAttribute('aria-label',value?`${value}，點擊再聽一次；點右上角叉號可移除`:'點選下方卡牌放入');}
function render(){normalizeTone();fillSlot('initial',state.initial);fillSlot('rhyme',state.rhyme);$('vertical').classList.toggle('single-sound',!!state.initial&&!state.rhyme);
 const base=syllable(), complete=valid(base),tones=availableTones(base);
 const mark=$('toneMark');mark.textContent=complete?(state.tone===0?'':TONES[state.tone].symbol):'';mark.classList.toggle('neutral',state.tone===4);mark.dataset.tone=String(state.tone);
 for(const b of $('toneButtons').children){const i=Number(b.dataset.tone);b.disabled=!complete||!tones[i];b.classList.toggle('active',complete&&i===state.tone&&tones[i]);b.setAttribute('aria-pressed',String(complete&&i===state.tone&&tones[i]));}
 $('playFull').disabled=!complete||!tones[state.tone];
 $('openExamples').disabled=!complete||!tones[state.tone];
 document.querySelectorAll('.card').forEach(b=>{const group=b.dataset.group,sym=b.dataset.symbol,available=canPick(group,sym);b.disabled=!available;b.classList.toggle('selected',state[group]===sym);b.setAttribute('aria-label',`${sym}${available?'':'，目前無法選擇'}`)});
}
function applyCard(group,sym,play=true){if(!canPick(group,sym))return;const wasComplete=playableSyllable(syllable());const target=normalizedSelection(group,sym);state.initial=target.initial;state.rhyme=target.rhyme;if(!wasComplete&&playableSyllable(syllable())){const preferred=PREFERRED_TONE[syllable()];if(preferred!=null)state.tone=preferred;}render();if(play)playCard(group,sym);}
function reset(){pauseAudio();state.initial='';state.rhyme='';state.tone=0;render();}
function createBank(railId,symbols,group){const rail=$(railId);for(const sym of symbols){const b=document.createElement('button');b.type='button';b.className='card'+(sym.length>1?' combo':'');b.dataset.group=group;b.dataset.symbol=sym;
 const display=document.createElement('span');display.className='symbols';if(sym.length>1){for(const ch of sym){const v=document.createElement('span');v.textContent=ch;display.append(v);}}else display.textContent=sym;b.append(display);
 b.addEventListener('click',()=>{if(suppressClick?.button===b&&performance.now()<suppressClick.until)return;applyCard(group,sym,true);});
 b.addEventListener('pointerdown',e=>beginDrag(e,b));
 rail.append(b);}}
function setupTones(){const tones=[['','一聲'],['ˊ','二聲'],['ˇ','三聲'],['ˋ','四聲'],['˙','輕聲']];tones.forEach(([sym,label],i)=>{const b=document.createElement('button');b.className='tone';b.type='button';b.dataset.tone=i;b.setAttribute('aria-label',label);b.innerHTML=`<span class="tone-icon">${sym}</span><span class="tone-text">${label}</span>`;b.addEventListener('click',()=>{if(b.disabled)return;state.tone=i;render();});$('toneButtons').append(b);});}
function exampleOpen(){const base=syllable(),key=`${base}|${state.tone}`,items=(EXAMPLES[key]||[]).filter(item=>item.char&&item.word);if(!items.length)return;previousFocus=document.activeElement;
 $('dialogName').textContent=`${state.tone===4?'˙'+base:base+TONES[state.tone].symbol} · 舉例`;
 const words=$('wordTiles');words.replaceChildren();$('definition').hidden=true;
 items.forEach((item,index)=>{const b=document.createElement('button');b.type='button';b.className='word-tile';b.innerHTML=`<span class="char"></span><span class="phrase"></span>`;b.querySelector('.char').textContent=item.char;b.querySelector('.phrase').textContent=item.word;b.addEventListener('click',()=>{
  [...words.children].forEach(x=>x.classList.remove('picked'));b.classList.add('picked');$('definition').hidden=false;$('definition').replaceChildren();const phrase=document.createElement('div');phrase.className='def-phrase';phrase.textContent=item.word;$('definition').append(phrase);if(item.sentence){const sentence=document.createElement('div');sentence.className='def-sentence';sentence.textContent=item.sentence;$('definition').append(sentence);}
 });words.append(b);});$('overlay').classList.remove('hidden');document.body.style.overflow='hidden';$('closeDialog').focus();}
function exampleClose(){$('overlay').classList.add('hidden');document.body.style.overflow='';previousFocus?.focus();}
function beginDrag(e,button){if(button.disabled||e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,button,group:button.dataset.group,symbol:button.dataset.symbol,active:false,clone:null};}
function moveDrag(e){if(!drag||drag.id!==e.pointerId)return;const d=drag,dx=e.clientX-d.x,dy=e.clientY-d.y;
 // 水平移動交給原生捲動；垂直往上才啟動拖曳卡牌。
 if(!d.active){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){drag=null;return;}if(Math.abs(dy)<11)return;d.active=true;try{d.button.setPointerCapture(e.pointerId)}catch(_){}const clone=document.createElement('div');clone.className='dragging-clone';clone.textContent=d.symbol;document.body.append(clone);d.clone=clone;}
 if(d.active){if(e.cancelable)e.preventDefault();d.clone.style.left=e.clientX+'px';d.clone.style.top=e.clientY+'px';document.querySelectorAll('.slot').forEach(el=>el.classList.remove('drag-over'));const target=document.elementFromPoint(e.clientX,e.clientY);const slot=target?.closest('.slot');if(slot&&(slot.dataset.target===d.group||(slot.dataset.target==='initial'&&d.group==='rhyme'&&MEDIALS.includes(d.symbol)&&canPick('initial',d.symbol))))slot.classList.add('drag-over');}}
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('drag-over'));if(!d.active)return;d.clone?.remove();suppressClick={button:d.button,until:performance.now()+180};const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');if(dest){if(dest.dataset.target===d.group)applyCard(d.group,d.symbol,true);else if(dest.dataset.target==='initial'&&d.group==='rhyme'&&MEDIALS.includes(d.symbol))applyCard('initial',d.symbol,true);}}

function setupModes(){const setMode=mode=>{pauseAudio();const compose=mode==='compose';$('composeMode').hidden=!compose;$('readMode').hidden=compose;for(const [id,selected] of [['tabCompose',compose],['tabRead',!compose]]){const b=$(id);b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));}};
 $('tabCompose').addEventListener('click',()=>setMode('compose'));
 $('tabRead').addEventListener('click',()=>setMode('read'));
 const grid=$('readingGrid');for(const symbol of [...INITIALS,...MEDIALS,...FINALS,...COMBOS]){const b=document.createElement('button');b.type='button';b.className='read-card';b.setAttribute('aria-label',`聽 ${symbol} 的發音`);const span=document.createElement('span');span.className='symbols'+(symbol.length>1?' read-stacked':'');for(const ch of symbol){const el=document.createElement('span');el.textContent=ch;span.append(el);}b.append(span);b.addEventListener('click',()=>{grid.querySelectorAll('.read-card.played').forEach(e=>e.classList.remove('played'));b.classList.add('played');playCard(INITIALS.includes(symbol)?'initial':'rhyme',symbol);});grid.append(b);}}
createBank('initialRail',FIRST_CARDS,'initial');createBank('rhymeRail',RYME_CARDS,'rhyme');setupTones();setupModes();render();setTimeout(warmAudio,150);
$('reset').addEventListener('click',reset);$('playFull').addEventListener('click',playComposed);$('openExamples').addEventListener('click',exampleOpen);$('closeDialog').addEventListener('click',exampleClose);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))exampleClose();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').classList.contains('hidden'))exampleClose();});
for(const [key,id] of [['initial','initialSlot'],['rhyme','rhymeSlot']]){$(id).addEventListener('click',e=>{if(!state[key])return;const rect=e.currentTarget.getBoundingClientRect();if(e.clientX>rect.right-30&&e.clientY<rect.top+24){state[key]='';render();pauseAudio();return;}playCard(key,state[key]);});}
for(const b of document.querySelectorAll('.rail-arrow'))b.addEventListener('click',()=>$(b.dataset.rail).scrollBy({left:Number(b.dataset.dir)*310,behavior:'smooth'}));
document.addEventListener('pointermove',moveDrag,{passive:false});document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',e=>{if(drag?.clone)drag.clone.remove();drag=null;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('drag-over'));});
</script>
</body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光學桌 V21</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:#213348;font:15px Arial,'Microsoft JhengHei',sans-serif}main{max-width:1500px;margin:auto;padding:15px}h1{margin:0 0 14px;font-size:27px}

.tool svg{width:48px;height:49px;pointer-events:none}.tool b{font-size:13px}.tool small{font-size:12px;color:#637084}.tool.ruler{background:#fff8e6}.tool:hover{border-color:#839eb9}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}button{font:700 14px Arial,'Microsoft JhengHei',sans-serif;border:1px solid #bfcedf;background:white;color:#233c54;padding:11px 13px;border-radius:8px;cursor:pointer}button:hover{background:#eaf4ff}button.active{background:#1767aa;color:white;border-color:#1767aa}button.purple{background:#774caa;color:white;border-color:#774caa}button:disabled{opacity:.42;cursor:not-allowed}
.panel{background:#fff;border:1px solid #d5e0eb;border-radius:12px;overflow:hidden}.head{padding:11px 15px;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.head .hint{font-size:13px;color:#617488}
.viewport{position:relative;height:min(66vh,620px);min-height:400px}canvas{height:100%;width:100%;display:block;touch-action:none}.zoom{position:absolute;right:12px;top:12px;display:flex;gap:5px;padding:5px;background:#ffffffeb;border:1px solid #ced8e3;box-shadow:0 2px 7px #0001;border-radius:10px;z-index:2}.zoom button{padding:8px 11px}
.bottom{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 15px;border-top:1px solid #e9edf2;font-size:14px;min-height:55px}.pill{padding:5px 10px;background:#e7f1ff;color:#135a99;border-radius:50px;font-weight:bold}.note{color:#5e7285}
.ghost{position:fixed;z-index:999;pointer-events:none;background:#fff;border:2px solid #83a7d0;box-shadow:0 5px 15px #0003;border-radius:7px;padding:9px;font-weight:bold}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 16px;color:white;background:#234055;border-radius:8px;display:none;z-index:1000}.toast.show{display:block}
@media(max-width:750px){main{padding:8px}.tool{width:82px;height:92px}.actions{margin-left:0}button{font-size:13px}.viewport{height:57vh;min-height:350px}h1{font-size:22px}}
</style></head><body><main><h1>光學桌</h1>
<div class="tools">
<div class="tool" data-type="specimen" role="button" tabindex="0"><svg viewBox="0 0 48 52"><path d="M16 5 C8 5,8 16,10 22 C12 28,9 38,19 39 C31 40,35 28,33 22 C31 13,27 4,16 5Z" fill="#d8f0e4" stroke="#2c936b" stroke-width="2.5"/><circle cx="16" cy="13" r="2" fill="#2c936b"/><circle cx="22" cy="20" r="2" fill="#2c936b"/><circle cx="14" cy="28" r="2" fill="#2c936b"/><path d="M9 12 q-8 3 -8 8M10 31 q-7 2 -8 8M28 12 q8 3 8 8M28 31 q8 2 8 8" stroke="#2c936b" stroke-width="1.8" fill="none"/></svg><b>細菌</b><small>細菌</small></div>
<div class="tool" data-type="tree" role="button" tabindex="0"><svg viewBox="0 0 48 52"><path d="M20 30h8v19h-8z" fill="#936637"/><path d="M24 3C11 3 4 15 9 25C1 30 9 41 19 38C27 46 42 36 38 27C44 15 35 6 24 3Z" fill="#a7db9c" stroke="#378d5a" stroke-width="2.2"/></svg><b>樹</b><small>示意大小</small></div>

<div class="tool" data-type="lens" data-f="4" role="button" tabindex="0"><svg viewBox="0 0 48 52"><path d="M24 3 Q35 26 24 49 Q13 26 24 3Z" fill="#169c9c4b" stroke="#169c9c" stroke-width="2.5"/></svg><b style="color:#078787">透鏡 B</b><small>f = 4 mm</small></div>
<div class="tool" data-type="lens" data-f="3" role="button" tabindex="0"><svg viewBox="0 0 48 52"><path d="M24 3 Q40 26 24 49 Q8 26 24 3Z" fill="#d18a2c4b" stroke="#d18a2c" stroke-width="2.5"/></svg><b style="color:#ad711d">透鏡 C</b><small>f = 3 mm</small></div>
<div class="tool" data-type="lens" data-f="2" role="button" tabindex="0"><svg viewBox="0 0 48 52"><path d="M24 3 Q44 26 24 49 Q4 26 24 3Z" fill="#a365b94b" stroke="#a365b9" stroke-width="2.5"/></svg><b style="color:#9254a8">透鏡 D</b><small>f = 2 mm</small></div>

<div class="tool symbol" data-type="role" data-role="eyepiece" role="button" tabindex="0"><svg viewBox="0 0 48 52"><path d="M24 7 Q34 26 24 45 Q14 26 24 7Z" fill="#e9a84d55" stroke="#ca8228" stroke-width="2.5"/><path d="M31 13h11M31 39h11" stroke="#ca8228" stroke-width="2"/></svg><b>目鏡</b></div>
<div class="tool symbol" data-type="eye" role="button" tabindex="0"><svg viewBox="0 0 48 52"><path d="M3 26Q24 5 45 26Q24 47 3 26Z" fill="#ebf5ff" stroke="#577c9b" stroke-width="2.6"/><circle cx="24" cy="26" r="9" fill="#6fa9d5" stroke="#295477" stroke-width="2"/><circle cx="24" cy="26" r="4" fill="#203e5d"/></svg><b>眼睛</b></div>
<div class="actions"><button data-ray-mode="all" class="active">全部光路</button><button data-ray-mode="physical">真實光路</button><button data-ray-mode="objective">物鏡光路</button><button data-ray-mode="eyepiece">目鏡光路</button><button data-ray-mode="none">隱藏光路</button><button id="virtual" disabled>看見虛像</button><button id="remove">移除選取</button><button id="reset">全部清除</button></div>
</div>
<div class="panel"><div class="head"><b>光路圖區</b><span class="hint" id="hint">可加入多個同類物體；光路顯示目前選取的物體；同類物體都會各自成像</span></div><div class="viewport"><canvas id="scene"></canvas><div class="zoom"><button id="out">－</button><button id="fit">適合視野</button><button id="in">＋</button></div></div><div class="bottom" id="info"><span class="pill">等待放置器材</span></div></div>
</main><div class="ghost" id="ghost" style="display:none"></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),info=document.getElementById('info'),hint=document.getElementById('hint'),virtualBtn=document.getElementById('virtual'),ghost=document.getElementById('ghost');
const styles={5:{name:'A',color:'#5082d6',thick:7},4:{name:'B',color:'#169c9c',thick:11},3:{name:'C',color:'#d18a2c',thick:16},2:{name:'D',color:'#a365b9',thick:21},'-5':{name:'E',color:'#cd536e',thick:12},'-3':{name:'F',color:'#6971c9',thick:16}};
const bacteriaColors=['#2c936b','#1e8ab7','#9b5db9','#ce6f2a','#be4d66','#6d9c30'];
const h0=0.65, treeHeight=5.0; let objectType='specimen'; let W=900,H=480,axis=245,scale=27,origin=105,id=0,items=[],selected=null,drag=null,pan=null,toolDrag=null,rayMode='all',showVirtual=false,animationAt=null,toastTimer;
const X=x=>origin+x*scale,Y=y=>axis-y*scale,invX=x=>(x-origin)/scale, labelZoom=()=>scale/27;
function resize(){const r=canvas.getBoundingClientRect(),ow=W;W=r.width;H=r.height;const dpr=window.devicePixelRatio||1;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);axis=H*.51;if(ow&&ow!==W)origin*=W/ow;draw()}
function line(x1,y1,x2,y2,color='#8293a3',w=2,dash=[]){ctx.save();ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.stroke();ctx.restore()}
function segment(x1,y1,x2,y2,color,w=2,dash=[]){if(![x1,y1,x2,y2].every(Number.isFinite))return;let dx=x2-x1,dy=y2-y1,lo=0,hi=1;for(const [p,q] of [[-dx,x1],[dx,W-x1],[-dy,y1],[dy,H-y1]]){if(Math.abs(p)<1e-12){if(q<0)return}else{let r=q/p;if(p<0)lo=Math.max(lo,r);else hi=Math.min(hi,r)}}if(lo>hi)return;line(x1+dx*lo,y1+dy*lo,x1+dx*hi,y1+dy*hi,color,w,dash)}
let pendingLabels=[];function label(x,y,s,color='#24374a',size=13,align='center',bold=false){pendingLabels.push({x,y,s,color,size,align,bold,priority:/透鏡實像|透鏡虛像|細菌/.test(s)?4:/^透鏡 |^f =/.test(s)?3:/^(F|2F)$/.test(s)?1:2})}
function directLabel(z,dy){ctx.save();ctx.fillStyle=z.color;ctx.font=(z.bold?'bold ':'')+Math.max(1,z.size*labelZoom())+'px Arial,"Microsoft JhengHei",sans-serif';ctx.textAlign=z.align;ctx.textBaseline='middle';ctx.fillText(z.s,z.x,z.y+dy);ctx.restore()}
function flushLabels(){const boxes=[]; for(const z of pendingLabels.sort((a,b)=>b.priority-a.priority)){ctx.save();ctx.font=(z.bold?'bold ':'')+Math.max(1,z.size*labelZoom())+'px Arial,"Microsoft JhengHei",sans-serif';const w=ctx.measureText(z.s).width+7*labelZoom(),h=(z.size+5)*labelZoom();ctx.restore();const px=z.align==='left'?z.x:z.align==='right'?z.x-w:z.x-w/2;let found=null;for(const dy of [0,-18,18,-35,35,-55,55]){const box={x:px,y:z.y+dy-h/2,w,h};if(box.y<1||box.y+box.h>H-1||box.x>W||box.x+box.w<0)continue;if(boxes.every(b=>box.x+box.w<=b.x||b.x+b.w<=box.x||box.y+box.h<=b.y||b.y+b.h<=box.y)){found={dy,box};break}}if(found){boxes.push(found.box);directLabel(z,found.dy)}}pendingLabels=[]}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
function getLenses(){return items.filter(i=>i.type==='lens').sort((a,b)=>a.x-b.x)}
function getBacteria(){return items.filter(i=>i.type==='specimen'||i.type==='tree').sort((a,b)=>a.x-b.x)}
function bacteriumColor(n){return n.type==='tree'?['#378d5a','#438d4d','#74a13b','#287e68'][n.id%4]:bacteriaColors[(n.id-1)%bacteriaColors.length]}
function drawBacterium(x,height,color='#2c936b',opacity=1){if(!Number.isFinite(x+height)||Math.abs(height)*scale>1e6)return;let px=X(x),heightPx=height*scale;ctx.save();ctx.translate(px,axis);ctx.scale(Math.max(.05,Math.abs(heightPx)/90),heightPx/90);ctx.globalAlpha=opacity;ctx.beginPath();ctx.moveTo(-11,-86);ctx.bezierCurveTo(-28,-92,-32,-74,-27,-53);ctx.bezierCurveTo(-23,-40,-24,-27,-22,-14);ctx.bezierCurveTo(-18,-3,8,0,18,-15);ctx.bezierCurveTo(25,-30,23,-54,18,-73);ctx.bezierCurveTo(12,-87,0,-91,-11,-86);ctx.closePath();ctx.fillStyle=color+'29';ctx.strokeStyle=color;ctx.lineWidth=3;ctx.fill();ctx.stroke();for(const [a,b,r] of [[-12,-67,5],[6,-73,4],[8,-48,5],[-8,-41,4],[3,-24,6]]){ctx.beginPath();ctx.arc(a,b,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}for(const [a,b,c,d] of [[-23,-65,-40,-63],[-25,-39,-42,-30],[-19,-13,-34,-4],[19,-71,38,-72],[22,-42,37,-27],[12,-12,27,6]]){ctx.beginPath();ctx.moveTo(a,b);ctx.quadraticCurveTo((a+c)/2,b-8,c,d);ctx.stroke()}ctx.restore()}
function objectHeight(obj){return obj?.type==='tree'?treeHeight:h0}
function objectName(obj){return obj?.type==='tree'?'樹':'細菌'}
function drawTree(x,height,color='#378d5a',opacity=1){
 if(!Number.isFinite(x+height))return;
 const hp=Math.abs(height)*scale,sign=height>=0?1:-1;
 ctx.save();ctx.translate(X(x),axis);ctx.scale(Math.max(.001,hp/100),sign*Math.max(.001,hp/100));ctx.globalAlpha=opacity;
 ctx.fillStyle='#8a643b';ctx.fillRect(-6,-48,12,48);
 ctx.beginPath();ctx.moveTo(-10,-44);ctx.bezierCurveTo(-44,-49,-40,-75,-22,-80);ctx.bezierCurveTo(-18,-105,20,-105,26,-82);ctx.bezierCurveTo(46,-70,35,-43,10,-43);ctx.closePath();
 ctx.fillStyle=color+'55';ctx.strokeStyle=color;ctx.lineWidth=3;ctx.fill();ctx.stroke();ctx.restore();
}
function drawObject(obj,x,height,color,opacity=1){if(obj?.type==='tree')drawTree(x,height,color,opacity);else drawBacterium(x,height,color,opacity)}
function calcForObject(obj){const ls=getLenses(),res=[];let objectX=obj.x,objectH=objectHeight(obj);for(let i=0;i<ls.length;i++){const lens=ls[i],u=lens.x-objectX,f=lens.f;if(i===1){const prev=res[0];if(!prev||prev.invalid||prev.far){res.push({lens,index:i,invalid:true});break}} if(Math.abs(u)<1e-6){res.push({lens,index:i,invalid:true});break} if(Math.abs(u-f)<1e-6){res.push({lens,index:i,u,f,far:true,objectX,objectH});break} const v=f*u/(u-f),m=-v/u,imageX=lens.x+v,imageH=m*objectH;res.push({lens,index:i,u,f,v,m,imageX,imageH,virtual:v<0,objectX,objectH,obj}); objectX=imageX; objectH=imageH;} return res}
function allCalculations(){return getBacteria().map(b=>({obj:b,res:calcForObject(b)}))}
function currentObject(){const specs=getBacteria(); if(!specs.length)return null; const picked=items.find(x=>x.id===selected&&(x.type==='specimen'||x.type==='tree')); return picked||specs[0]}
function currentCalc(){const obj=currentObject(); return obj?calcForObject(obj):[]}
const rayColors=['#207dc5','#df8730'];
function principalRays(result){ if(!result||result.invalid||result.far||result.u<=0)return []; const l=result.lens,ox=result.objectX,oh=result.objectH,x=l.x; return [{color:rayColors[0],x0:ox,y0:oh,x1:x,y1:oh,outputSlope:-oh/l.f},{color:rayColors[1],x0:ox,y0:oh,x1:x,y1:0,outputSlope:-oh/(x-ox)}] }
function drawStageRays(r,stage){
 if(!r||r.invalid||r.far||r.u<=0)return;
 const rays=principalRays(r);if(rays.length<2)return;
 const lenses=getLenses();const next=lenses.find(l=>l.x>r.lens.x+1e-6);
 for(const ray of rays){
  // The incident leg and outgoing leg join exactly at the lens.
  segment(X(ray.x0),Y(ray.y0),X(ray.x1),Y(ray.y1),ray.color,2.5);
  const far=invX(W)+2;
  const target=(!r.virtual&&r.imageX>r.lens.x)?r.imageX:far;
  const end=next?Math.min(next.x,target):target;
  segment(X(ray.x1),Y(ray.y1),X(end),Y(ray.y1+ray.outputSlope*(end-ray.x1)),ray.color,2.5);
 }
}
function drawPhysicalRays(res,obj){
 const lenses=getLenses();if(!obj||!lenses.length)return;
 const first=lenses[0],u=first.x-obj.x,objectH=objectHeight(obj);
 if(u<=0.000001)return;
 // Trace identical rays through each actual lens, with y and direction continuous.
 const rays=[{slope:0,color:rayColors[0]},{slope:-objectH/u,color:rayColors[1]}];
 for(const ray of rays){
  let x=obj.x,y=objectH,slope=ray.slope;
  for(const lens of lenses){
   const nextY=y+slope*(lens.x-x);
   segment(X(x),Y(y),X(lens.x),Y(nextY),ray.color,2.7);
   x=lens.x;y=nextY;slope-=y/lens.f;
  }
  const last=res.at(-1),far=invX(W)+2;
  // Rays continue after the last lens, regardless of intermediate image position.
  const end=last&&!last.invalid&&!last.far&&!last.virtual&&last.imageX>x?Math.max(last.imageX,far):far;
  segment(X(x),Y(y),X(end),Y(y+slope*(end-x)),ray.color,2.7);
 }
}
function selectedVirtual(res,ls){ if(rayMode==='none')return null; if(rayMode==='objective')return res[0]?.virtual?res[0]:null; if(rayMode==='eyepiece')return res[1]?.virtual?res[1]:null; if(ls.length===2)return res[1]?.virtual?res[1]:null; return res[0]?.virtual?res[0]:null; }
function virtualBacktrace(result){ if(!showVirtual||!result||!result.virtual||result.invalid||result.far)return; const rays=principalRays(result); const x0=result.lens.x,target=result.imageX; const progress=animationAt===null?1:Math.min(1,(performance.now()-animationAt)/1300); const curr=x0+(target-x0)*progress; for(let i=0;i<rays.length;i++){const ray=rays[i];segment(X(x0),Y(ray.y1),X(curr),Y(ray.y1+ray.outputSlope*(curr-x0)),i===0?'#7646b8':'#b36bd2',3,[8,5]);} if(progress>=1){ctx.beginPath();ctx.arc(X(result.imageX),Y(result.imageH),5,0,Math.PI*2);ctx.fillStyle='#804ac2';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke(); } else requestAnimationFrame(draw) }
function isRealIntermediate(res){return res.length>0&&!res[0].invalid&&!res[0].far&&!res[0].virtual&&(!res[1]||res[0].imageX<res[1].lens.x)}
function firstRealImage(res){return Boolean(res[0]&&!res[0].invalid&&!res[0].far&&!res[0].virtual&&Number.isFinite(res[0].imageX+res[0].imageH))}
function lensShape(n){const s=styles[n.f],x=X(n.x),half=145*(scale/27); label(x,axis-half-25*labelZoom(),'透鏡 '+s.name,s.color,13,'center',true); label(x,axis+half+20*labelZoom(),'f = '+n.f+' mm',s.color,12); for(let dir of [-1,1])for(let mult of [1,2]){let xx=X(n.x+dir*Math.abs(n.f)*mult); if(xx<-20||xx>W+20)continue; ctx.beginPath();ctx.arc(xx,axis,mult===1?3.8:3.2,0,2*Math.PI);ctx.fillStyle=s.color;ctx.fill(); label(xx,axis+(mult===1?17:32)*labelZoom(),mult===1?'F':'2F',s.color,12,'center',mult===1)}}
function drawLens(n){const s=styles[n.f],x=X(n.x),w=(64*scale/27),h=(300*scale/27),thick=s.thick*(scale/27); ctx.save();ctx.translate(x-w/2,axis-h/2); ctx.beginPath(); if(n.f>0){ctx.moveTo(w/2,0); ctx.quadraticCurveTo(w/2+thick,h/2,w/2,h); ctx.quadraticCurveTo(w/2-thick,h/2,w/2,0);} else {ctx.moveTo(w/2-thick,0); ctx.quadraticCurveTo(w/2-thick+8*(scale/27),h/2,w/2-thick,h); ctx.lineTo(w/2+thick,h); ctx.quadraticCurveTo(w/2+thick-8*(scale/27),h/2,w/2+thick,0); } ctx.closePath(); ctx.fillStyle=s.color+'38'; ctx.strokeStyle=s.color; ctx.lineWidth=selected===n.id?4:2.4; ctx.fill(); ctx.stroke(); ctx.restore();}
function niceStep(minimum){const exponent=Math.floor(Math.log10(Math.max(minimum,1e-9))),power=10**exponent; for(const m of [1,2,5,10])if(m*power>=minimum-1e-10)return m*power; return 10*power}
function readableNumber(value,step){const digits=Math.max(0,Math.min(5,-Math.floor(Math.log10(step))+1)); return Number(value.toFixed(digits)).toString()}
function ruler(n){const x=X(n.x),width=92,halfWidth=width/2,left=x-halfWidth; const major=niceStep(55/scale),minor=major/5,showMinor=minor*scale>=10; ctx.save(); ctx.beginPath();ctx.roundRect(left,-10,width,H+20,5); ctx.fillStyle='#fff2be'; ctx.strokeStyle=selected===n.id?'#835906':'#a08231'; ctx.lineWidth=selected===n.id?3:1.5; ctx.fill(); ctx.stroke(); ctx.beginPath();ctx.rect(left+1,0,width-2,H); ctx.clip(); const drawTicks=(step,isMajor)=>{const first=Math.ceil(((axis-H)/scale)/step-1e-9),last=Math.floor((axis/scale)/step+1e-9); for(let k=first;k<=last;k++){const val=k*step,yy=Y(val); if(!isMajor&&Math.abs(val/major-Math.round(val/major))<1e-7)continue; line(left+3,yy,left+(isMajor?26:14),yy,'#765817',isMajor?1.8:1); if(isMajor){ctx.save();ctx.font='bold 13px Arial,"Microsoft JhengHei",sans-serif';ctx.fillStyle='#50390b';ctx.textBaseline='middle';ctx.fillText(readableNumber(val,major),left+31,yy,width-35);ctx.restore();}}}; if(showMinor)drawTicks(minor,false); drawTicks(major,true); ctx.restore(); if(axis>=0&&axis<=H)line(left-3,axis,x+halfWidth+3,axis,'#654d14',2)}
function markerPos(n){if(n.type==='role'&&n.attach){const ls=getLenses().find(z=>z.id===n.attach);if(ls)return {x:ls.x,y:Math.min(4.4,(axis-30)/scale)}}return{x:n.x,y:n.y||0}}
function drawMarker(n){let p=markerPos(n),px=X(p.x),py=Y(p.y||0); if(n.type==='eye'){ctx.save();ctx.translate(px,py);ctx.beginPath();ctx.moveTo(-25,0);ctx.quadraticCurveTo(0,-22,25,0);ctx.quadraticCurveTo(0,22,-25,0);ctx.fillStyle='#eaf7ff';ctx.fill();ctx.strokeStyle=selected===n.id?'#f39a23':'#456e91';ctx.lineWidth=2.6;ctx.stroke();ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fillStyle='#82b0d2';ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fillStyle='#27465c';ctx.fill();ctx.restore(); label(px,py+29,'眼睛','#395c7c',12,'center',true)} else {const color=n.role==='objective'?'#217abd':'#bd781f',name=n.role==='objective'?'物鏡':'目鏡'; ctx.save();ctx.beginPath();ctx.roundRect(px-29,py-15,58,30,7); ctx.fillStyle=n.role==='objective'?'#e7f3ff':'#fff0d9'; ctx.strokeStyle=selected===n.id?'#f39a23':color; ctx.lineWidth=2; ctx.fill();ctx.stroke();ctx.restore(); label(px,py,name,color,13,'center',true)}}
function draw(){ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); pendingLabels=[]; for(let x=(origin%50+50)%50;x<W;x+=50)line(x,0,x,H,'#f2f5f8',1); for(let y=(axis%50+50)%50;y<H;y+=50)line(0,y,W,y,'#f2f5f8',1); line(0,axis,W,axis,'#8a99a8',1.8);
 const bacteria=getBacteria(), lenses=getLenses(), calcs=allCalculations(), activeObj=currentObject(), activeCalc=currentCalc();
 // images for all bacteria

    drawObject(obj,virt.imageX,virt.imageH,bacteriumColor(obj),.65);
    label(X(virt.imageX),Y(virt.imageH)+(virt.imageH>0?-20:20)*labelZoom(),objectName(obj)+' '+obj.name+' · '+styles[virt.lens.f].name+'透鏡虛像','#8145a6',13,'center',true);
  }
 }
 for(const b of bacteria){const c=bacteriumColor(b); drawObject(b,b.x,objectHeight(b),c,selected===b.id?1:.88); label(X(b.x),Y(objectHeight(b))-18*labelZoom(),objectName(b)+' '+b.name,c,14,'center',true)}
 for(const n of items.filter(n=>n.type==='ruler'))ruler(n); for(const l of lenses){drawLens(l); lensShape(l)} for(const n of items.filter(n=>n.type==='role'||n.type==='eye'))drawMarker(n); flushLabels();
 document.querySelectorAll('[data-ray-mode]').forEach(b=>b.classList.toggle('active',b.dataset.rayMode===rayMode)); const canVirtual=Boolean(currentVirtual&&currentVirtual.virtual&&!currentVirtual.invalid&&!currentVirtual.far&&principalRays(currentVirtual).length===2); virtualBtn.disabled=!canVirtual; virtualBtn.classList.toggle('purple',Boolean(canVirtual&&showVirtual)); virtualBtn.textContent=showVirtual?'隱藏虛像':'看見虛像';
 info.replaceChildren(); const addInfo=(s,cl)=>{const el=document.createElement('span'); el.textContent=s; if(cl)el.className=cl; info.appendChild(el)}; if(!bacteria.length){addInfo('先加入細菌或樹','pill'); hint.textContent='可加入多個同類物體，再拖曳透鏡觀察多個像'; return} addInfo(`${objectType==='tree'?'樹':'細菌'} ${bacteria.length} 個`,'pill'); if(activeObj)addInfo(`目前光路：${objectName(activeObj)} ${activeObj.name}`,'note'); if(!lenses.length){addInfo('等待放置透鏡','note'); hint.textContent='光路以被選取的物體顯示；所有物體都會各自成像'; return} if(lenses.length===1){addInfo(`單片透鏡：${styles[lenses[0].f].name}`,'note'); hint.textContent='加入第二片透鏡可觀察接續成像'; return} addInfo(`${styles[lenses[0].f].name}透鏡 → ${styles[lenses[1].f].name}透鏡`,'note'); hint.textContent='所有物體都會依序通過兩片透鏡形成各自的像'; }
function fit(includeVirtual=true){const bacteria=getBacteria(),lenses=getLenses(),calcs=allCalculations(); let xmin=-.6,xmax=.8,ymin=-1.2,ymax=1.2; const extend=(x,y,dx=0,dy=0)=>{if(!Number.isFinite(x)||!Number.isFinite(y))return; xmin=Math.min(xmin,x-dx); xmax=Math.max(xmax,x+dx); ymin=Math.min(ymin,y-dy); ymax=Math.max(ymax,y+dy)}; bacteria.forEach(b=>extend(b.x,objectHeight(b)/2,.8,objectHeight(b)/2+.7)); lenses.forEach(l=>{extend(l.x,0,1.25,6.85); extend(l.x-2*Math.abs(l.f),0,.38,.4); extend(l.x+2*Math.abs(l.f),0,.38,.4)}); calcs.forEach(({res})=>res.forEach(r=>{if(r.invalid||r.far||!Number.isFinite(r.imageX)||!Number.isFinite(r.imageH))return; if(r.virtual&&(!includeVirtual||!showVirtual))return; if(Math.abs(r.imageX)>5000||Math.abs(r.imageH)>5000)return; extend(r.imageX,r.imageH/2,.9,Math.abs(r.imageH)/2+.9)})); const padX=75,padY=66; const width=Math.max(.5,xmax-xmin),height=Math.max(.5,ymax-ymin),availableW=Math.max(100,W-2*padX),availableH=Math.max(100,H-2*padY); scale=Math.min(150,availableW/width,availableH/height); scale=Math.max(.0001,scale); origin=W/2-(xmin+xmax)*scale/2; axis=H/2+(ymin+ymax)*scale/2; draw()}
function zoom(factor){const center=W/2,old=scale; scale=Math.min(200,Math.max(.0001,scale*factor)); origin=center-(center-origin)*scale/old; draw()}
function defaultLensX(f){const lenses=getLenses(); if(!lenses.length){const leftmost=Math.min(...getBacteria().map(b=>b.x),0); return leftmost+Math.max(4.5,Math.abs(f)*1.7)} const image=calcForObject(currentObject()||getBacteria()[0])[0]; if(image&&!image.invalid&&!image.far&&!image.virtual&&Number.isFinite(image.imageX)) return image.imageX+Math.max(.75,Math.abs(f)*.65); return lenses[0].x+Math.max(7,3*Math.abs(lenses[0].f))}
function defaultSpecimenX(){const specs=getBacteria(); if(!specs.length)return 0; const lenses=getLenses(); const leftBound=lenses.length?Math.min(...lenses.map(l=>l.x))-1.2:specs.at(-1).x+1.2; return Math.min(specs.at(-1).x+1.2,leftBound)}
function defaultToolX(type,f){ if(type==='specimen'||type==='tree')return defaultSpecimenX(); if(type==='lens')return defaultLensX(Number(f)); if(type==='ruler')return getLenses()[0]?.x||2; return getLenses().length?getLenses().at(-1).x+3:5 }
function add(type,f,x){if(type==='lens'&&getLenses().length>=2){toast('最多放置兩片透鏡；可移除後更換');return} let obj={id:++id,type,x:Math.max(type==='lens'?0.15:-1000,Math.min(1000,x))}; if(type==='lens'){obj.f=Number(f)} else if(type==='specimen'||type==='tree'){if(objectType!==type){showVirtual=false;animationAt=null;} objectType=type;items=items.filter(i=>!(i.type==='specimen'||i.type==='tree')||i.type===type);obj.name=String(items.filter(i=>i.type===type).length+1); obj.x=Math.min(obj.x, (Math.min(...getLenses().map(l=>l.x), 999)-0.5)); if(!Number.isFinite(obj.x)) obj.x=x;} else if(type==='eye'){obj.y=0.75;const lenses=getLenses();if(lenses.length)obj.x=lenses[lenses.length-1].x+3.5;} else if(type==='role'){obj.role=typeof f==='string'?f:'objective';obj.y=2.7;const ls=getLenses();const matching=ls.find((l,i)=>(obj.role==='objective'?i===0:i===1));if(matching){obj.attach=matching.id;obj.x=matching.x;}} items.push(obj); selected=obj.id; if(type==='lens'){showVirtual=false;animationAt=null;} draw()}
function hit(px,py){for(let i=items.length-1;i>=0;i--){let n=items[i],pos=(n.type==='role'||n.type==='eye')?markerPos(n):n,x=X(pos.x); if(n.type==='eye'&&Math.abs(px-x)<30&&Math.abs(py-Y(pos.y))<28)return n; if(n.type==='role'&&Math.abs(px-x)<35&&Math.abs(py-Y(pos.y))<23)return n; if(n.type==='ruler'&&Math.abs(px-x)<46&&Math.abs(py-axis)<H*.5)return n; if(n.type==='lens'&&Math.abs(px-x)<Math.max((32+styles[n.f].thick)*(scale/27),12)&&Math.abs(py-axis)<145*(scale/27)+12)return n; if((n.type==='specimen'||n.type==='tree')&&Math.abs(px-x)<Math.max(18,objectHeight(n)*scale*.35)&&Math.abs(py-Y(objectHeight(n)/2))<Math.max(40,objectHeight(n)*scale*.55))return n} return null}
function pointer(e){const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.style.cursor='grab'; canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return; const p=pointer(e),n=hit(p.x,p.y); e.preventDefault(); canvas.setPointerCapture(e.pointerId); if(n){selected=n.id; drag={id:n.id,delta:p.x-X((n.type==='role'||n.type==='eye')?markerPos(n).x:n.x),deltaY:p.y-Y((n.type==='role'||n.type==='eye')?markerPos(n).y||0:0)}; pan=null;} else {selected=null; pan={pointerId:e.pointerId,startX:p.x,startY:p.y,origin,axis}; drag=null;} canvas.style.cursor='grabbing'; draw()});
canvas.addEventListener('pointermove',e=>{const p=pointer(e); if(pan&&pan.pointerId===e.pointerId){origin=pan.origin+p.x-pan.startX; axis=pan.axis+p.y-pan.startY; draw(); return;} if(!drag)return; const n=items.find(z=>z.id===drag.id); if(!n)return; n.x=Math.max(n.type==='lens'?0.15:-1000,Math.min(1000,invX(p.x-drag.delta))); if(n.type==='specimen'||n.type==='tree'){const leftLens=Math.min(...getLenses().map(l=>l.x),Infinity); if(Number.isFinite(leftLens)) n.x=Math.min(n.x,leftLens-0.2)} if(n.type==='role'||n.type==='eye'){n.y=(axis-(p.y-drag.deltaY))/scale; if(n.type==='role')n.attach=null;} if(n.type==='lens'){showVirtual=false;animationAt=null;} draw()});
function stopCanvasDrag(){if(drag){const n=items.find(z=>z.id===drag.id); if(n?.type==='role'){const near=getLenses().find(l=>Math.abs(X(l.x)-X(n.x))<70); if(near){n.attach=near.id;n.x=near.x;n.y=2.7;}}} drag=null; pan=null; canvas.style.cursor='grab'}
canvas.addEventListener('pointerup',stopCanvasDrag); canvas.addEventListener('pointercancel',stopCanvasDrag); canvas.addEventListener('lostpointercapture',stopCanvasDrag);
for(const t of document.querySelectorAll('.tool')){t.addEventListener('pointerdown',e=>{if(e.button!==0)return; e.preventDefault(); toolDrag={t,startX:e.clientX,startY:e.clientY,moved:false}; const type=t.dataset.type; ghost.textContent=type==='specimen'?'細菌':type==='tree'?'樹':type==='ruler'?'直尺':type==='eye'?'眼睛':type==='role'?(t.dataset.role==='objective'?'物鏡':'目鏡'):`${Number(t.dataset.f)<0?'凹':'凸'}透鏡 ${styles[Number(t.dataset.f)].name}`; t.setPointerCapture(e.pointerId)}); t.addEventListener('pointermove',e=>{if(!toolDrag||toolDrag.t!==t)return; if(Math.hypot(e.clientX-toolDrag.startX,e.clientY-toolDrag.startY)>6)toolDrag.moved=true; if(toolDrag.moved){ghost.style.display='block'; ghost.style.left=e.clientX+12+'px'; ghost.style.top=e.clientY+12+'px';}}); t.addEventListener('pointerup',e=>{if(!toolDrag||toolDrag.t!==t)return; const moved=toolDrag.moved; toolDrag=null; ghost.style.display='none'; const rect=canvas.getBoundingClientRect(); if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom)add(t.dataset.type,t.dataset.type==='role'?t.dataset.role:Number(t.dataset.f||0),invX(e.clientX-rect.left)); else if(!moved){const f=t.dataset.type==='role'?t.dataset.role:Number(t.dataset.f||0); add(t.dataset.type,f,defaultToolX(t.dataset.type,f))} else toast('請拖曳至光路圖區')}); t.addEventListener('pointercancel',()=>{toolDrag=null; ghost.style.display='none'}); t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); const f=t.dataset.type==='role'?t.dataset.role:Number(t.dataset.f||0); add(t.dataset.type,f,defaultToolX(t.dataset.type,f))}})}
document.querySelectorAll('[data-ray-mode]').forEach(b=>b.addEventListener('click',()=>{rayMode=b.dataset.rayMode; if(rayMode==='none'){showVirtual=false;animationAt=null;} draw()})); virtualBtn.addEventListener('click',()=>{if(virtualBtn.disabled)return; showVirtual=!showVirtual; animationAt=showVirtual?performance.now():null; if(showVirtual)fit(true); else draw()}); document.getElementById('out').addEventListener('click',()=>zoom(.75)); document.getElementById('in').addEventListener('click',()=>zoom(1.33)); document.getElementById('fit').addEventListener('click',()=>fit(true)); document.getElementById('remove').addEventListener('click',()=>{if(selected===null){toast('先選取要移除的器材或細菌');return} const removed=items.find(x=>x.id===selected); items=items.filter(x=>x.id!==selected); selected=null; if(removed?.type==='lens'){showVirtual=false;animationAt=null;} if((removed?.type==='specimen'||removed?.type==='tree')&&items.every(x=>x.type!=='specimen'&&x.type!=='tree')){add(objectType,0,0); return;} draw()}); document.getElementById('reset').addEventListener('click',()=>{items=[]; selected=null; rayMode='all'; showVirtual=false; scale=27; origin=W*.12; axis=H*.51; add(objectType,0,0)});
window.addEventListener('keydown',e=>{if(e.key==='Delete'&&selected!==null){items=items.filter(x=>x.id!==selected); selected=null; draw()}}); window.addEventListener('resize',resize); resize(); add('specimen',0,0);
